<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>富煜蔬菜 — 訂單確認</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f0faf2; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border-radius: 16px; padding: 32px 24px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.1); max-width: 360px; width: 90%; }
    .logo { font-size: 22px; font-weight: bold; color: #2d6a4f; margin-bottom: 12px; }
    .msg { color: #555; font-size: 15px; margin-bottom: 8px; }
    .spinner { width: 36px; height: 36px; border: 4px solid #d8f3dc; border-top-color: #2d6a4f; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 16px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #c0392b; font-size: 14px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🥦 富煜蔬菜</div>
    <div class="spinner"></div>
    <div class="msg">正在載入訂單確認頁面...</div>
    <div class="error" id="errMsg">找不到此訂單，可能已上傳或連結已失效。</div>
  </div>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwntJMo9D4q-nmlFli6tNkT1SPKZOCh0S-_XPpaqE88TfBFJ2UnnsJkjRfO5KC35yZ7TA/exec';
    const path = window.location.pathname;
    const parts = path.split('/').filter(p => p.length > 0);
    const id = parts[parts.length - 1];

    if (id && id.length === 6 && /^[A-Z0-9]+$/.test(id)) {
      const redirectUrl = GAS_URL + '?action=pending&id=' + id;
      window.location.replace(redirectUrl);
    } else {
      document.querySelector('.spinner').style.display = 'none';
      document.getElementById('errMsg').style.display = 'block';
    }
  </script>
</body>
</html>
